<!DOCTYPE html>
<html lang="{{.Site.Language}}">
<head>
{{template "head" .}}
</head>
<body>
<header><a href="/">{{.Site.Title}}</a></header>
<main>
<article>
<h1>{{.Page.Title}}</h1>
<p><time datetime="{{date "2006-01-02" .Page.Date}}">{{date "January 2, 2006" .Page.Date}}</time></p>
{{- range .Page.Updates}}
<p>Updated <time datetime="{{date "2006-01-02" .Date}}">{{date "January 2, 2006" .Date}}</time>.{{with .Note}} {{.}}{{end}}</p>
{{- end}}
{{.Page.Content}}
</article>
</main>
{{template "footer" .}}
</body>
</html>
